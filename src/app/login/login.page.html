<ion-header>
  <ion-toolbar color="primary">
    <ion-title>DAM CRM · Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid fixed>
    <ion-row class="ion-justify-content-center">
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card>
          <ion-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()">
              <ion-input class="ion-margin-bottom" label="Email" labelPlacement="stacked" fill="outline"
                type="email" autocomplete="email" formControlName="email"
                errorText="Introduce un email válido"></ion-input>

              <ion-input class="ion-margin-bottom" label="Contraseña" labelPlacement="stacked" fill="outline"
                type="password" formControlName="password"
                errorText="Mínimo 6 caracteres"></ion-input>

              @if (errorMsg()) {
                <ion-text color="danger"><p role="alert">{{ errorMsg() }}</p></ion-text>
              }

              <ion-button type="submit" expand="block" [disabled]="loading()">
                {{ loading() ? 'Entrando…' : 'Entrar' }}
              </ion-button>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
